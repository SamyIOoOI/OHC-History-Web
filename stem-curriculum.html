<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script>(()=>{try{const s=localStorage,d=document.documentElement;if(s.getItem("hw_theme")==="light")d.classList.add("light");if(s.getItem("hw_crt")==="off")d.classList.add("no-crt");if(s.getItem("hw_chars")==="off")d.classList.add("no-chars")}catch(e){}})();</script>
    <title>STEM Curriculum - The History Web</title>
    <link rel='stylesheet' href='carthage.css'>
    <link rel="stylesheet" href="theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <script defer src="settings.js"></script>
</head>
<body>
    <audio class="sfx" loop id="identity0">
        <source src="backgroundsound.wav" type="audio/wav">
    </audio>
    <div id="dotty">
    </div>
    <div id="stickystuck">
        <img src="tinylogo.png" class="logo" style="width: auto; height: 2.5em; margin-left: 5px;" role="button" tabindex="0" aria-expanded="false">
    <a href="index.html">Home</a>
    <a href="#map" id="mapnav">Map</a>
    <a href="content.html">Content</a>
    <a href="stem-curriculum.html">STEM Curriculum</a>
    <a href="articles.html">Articles</a>
    <img src="warriorwheel/1.png" class="soldier" onclick="rollit()" id="wheel">
</div>
    <div class="candywrapper">
        <div class="sky"></div>
        <div class="table" id="map">
            <h1 class="division">STEM Curriculum</h1>
            <p>WORK IN PROGRESS</p>
        </div>
    </div>
    <script>
        const audio = document.getElementById('identity0');
        let current_soldier = 1;
        function playaudio() {
            if (audio.currentTime > 0) {
                audio.pause();
                audio.currentTime = 0;
            } else {
                audio.volume = 0.2;
                audio.play();
            }
        }
        function rollit() {
            current_soldier = current_soldier < 16 ? current_soldier + 1 : 1;
            document.getElementById('wheel').src = `warriorwheel/${current_soldier}.png`;
        }
        if (window.matchMedia('(pointer: fine)').matches) {
            document.addEventListener('mousemove', event => {
                const cursor = document.getElementById('dotty');
                cursor.style.left = `${event.clientX}px`;
                cursor.style.top = `${event.clientY}px`;
            });
        }
        const sky = document.querySelector('.sky');
        for (let index = 0; index < 60; index++) {
            const character = document.createElement('div');
            const width = 48;
            character.className = 'wind';
            character.style.top = `${Math.random() * 100}%`;
            character.style.height = `${width}px`;
            character.style.width = `${width}px`;
            character.style.backgroundSize = '1440px 48px';
            character.style.backgroundPositionX = `${-Math.floor(Math.random() * 20) * width}px`;
            character.style.opacity = (0.8 + Math.random() * 0.15).toFixed(2);
            character.style.animation = `move ${15 + Math.random() * 20}s linear infinite`;
            character.style.animationDelay = `${-Math.random() * 30}s`;
            sky.appendChild(character);
        }
    </script>
</body>
</html>
