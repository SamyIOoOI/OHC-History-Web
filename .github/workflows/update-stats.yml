name: Update visit stats

on:
  schedule:
    - cron: '23 4 * * *'   # daily, 06:23 Cairo time
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch Cloudflare visit stats
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python3 .github/update-stats.py

      - name: Commit stats.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && echo "no change" || (git commit -m "chore: update visit stats" && git push)

      - name: Compare visit totals (read-only diagnostic)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 10
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python3 .github/diagnose-stats.py

