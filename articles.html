<body>
    <audio class="sfx" loop>

    <div id="dotty">

    <img src="warriorwheel/1.png" class="soldier" onclick="rollit()" id="wheel">
</div>
    <div class="candywrapper">
    <div class="sky">    
    </div> 
      <footer>
        <p style="text-indent: 1em; color: orangered;" align="center">Made by Samy Mohamed - OHC History Mentor - SamyIOoOI on Github - under the GPL 3.0 Licence</p>
    </footer>
</div>
    <div class="grainy">
    </div>
    <div class="glitches">
    </div>

<script>
    const sky = document.querySelector('.sky');
    const COUNT = 60;
    const FRAME_W = 32;
    const SHEET_SCALE = 1.5;
    let current_soldier = 1;
    
    let cursor = document.querySelector('#dotty');
    let body = document.querySelector('.candywrapper');
    let warriorwheel = document.getElementById("wheel"); 
    if (window.matchMedia('(pointer: fine)').matches){
    document.addEventListener('mousemove', e =>{
        body.style.backgroundPositionX = e.pageX / -11 + 'px';
        body.style.backgroundPositionY = e.pageY / -11 + 'px';
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    })}
    function rollit(){
        if (current_soldier < 16){
            current_soldier++;
        }
        else (
            current_soldier = 1
        )
        warriorwheel.src = "warriorwheel/"+ current_soldier +".png"
        
    }
    function throwacoinatmyface(target, target2){
        const bodytext = document.getElementsByClassName(target)[0];
        const arrowpointer = document.getElementsByClassName(target2)[0];
        if(bodytext.style.display == 'block'){
            bodytext.style.display = 'none';
            arrowpointer.textContent= '>';
        }
        else{
            bodytext.style.display = 'block';
            arrowpointer.textContent= 'v';
        }
    }
    for (let i = 0; i < COUNT; i++){
        const swirly = document.createElement('div');
        swirly.className = 'wind';
        const randframe = Math.floor(Math.random() * 20);
        const w = 32 * SHEET_SCALE;
        swirly.style.top = Math.random() * 100 + '%';
        swirly.style.height = w + 'px';
        swirly.style.width = w + 'px';
        swirly.style.backgroundSize = (960 * SHEET_SCALE) + 'px ' + (32 * SHEET_SCALE) + 'px';
        swirly.style.backgroundPositionX = -(randframe * w) + 'px';
        swirly.style.opacity = (0.8 + Math.random() * 0.15).toFixed(2);
        swirly.style.animation = `move ${15 + Math.random() * 20}s linear infinite`;
        swirly.style.animationDelay = -Math.random() * 30 + 's';



        sky.appendChild(swirly);
    }
</script>
</body>
</html>
